# fail2ban filter: failed Radicale logins, by the client address that nginx forwards.
# Install as /etc/fail2ban/filter.d/radui-radicale-auth.conf, together with the jail
# (radui-radicale-auth.jail.conf rendered from the .tpl file in this directory).
#
# THE PAIR RULE: this filter trusts the address in "(forwarded for '...')". That address is only
# trustworthy because nginx OVERWRITES X-Forwarded-For with $remote_addr (see
# deploy/nginx/radui-proxy-headers.inc.tpl). Never install the jail without that nginx change.
#
# Source of truth: Radicale 3.9 (radicale/app/__init__.py) logs, at WARNING level, one line per
# failed login:
#
#   Failed login attempt from <REMOTE_ADDR> (forwarded for '<X-Forwarded-For>'): <login!r> (<auth type>)
#
# Under systemd the journal message is "[<pid>/<thread>] [WARNING] " followed by that text, and
# fail2ban's systemd backend presents it as "<hostname> radicale[<pid>]: <message>" (the
# timestamp is removed before matching). With a log file in Radicale's "verbose" format the line
# starts with "[<timestamp>] " instead; both are accepted.
#
# Injection: the login (chosen by the attacker) comes AFTER the forwarded address in the line and
# is written with repr(), so it cannot contain a raw line break, and the regex is anchored at the
# start of the line with the fixed prefix and the trusted proxy address: the first, genuine
# "(forwarded for ...)" is the one that matches, whatever the login contains. tests/fail2ban/
# proves this with a login that contains "(forwarded for '...')".
#
# REMOTE_ADDR must be the reverse proxy itself (loopback by default). A line with any other
# REMOTE_ADDR, or without a forwarded address (a direct connection), is not matched on purpose.
# If your proxy connects from another address, override _trusted_proxy in the jail:
#   filter = radui-radicale-auth[_trusted_proxy="192\.0\.2\.10"]

[DEFAULT]
_trusted_proxy = 127\.0\.0\.1|::1

[Definition]
failregex = ^\s*(?:\S+ radicale\[\d+\]: |\[[^\]]*\] )?\[\d+(?:/[^\]]*)?\] \[WARNING\] Failed login attempt from (?:%(_trusted_proxy)s) \(forwarded for '<ADDR>'\): 

ignoreregex =

