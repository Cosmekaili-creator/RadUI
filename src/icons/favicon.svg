<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>RadUI</title>
  <!-- RadUI master mark: a ring (the cycle of days) with one dot cut into it (a scheduled moment).
       Accent #1E5E52 "lake green", foreground #F4F7F5. Geometry is on a 64 grid. -->
  <rect width="64" height="64" rx="15" fill="#1E5E52"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#F4F7F5" stroke-width="6"/>
  <circle cx="42.6" cy="21.4" r="10" fill="#1E5E52"/>
  <circle cx="42.6" cy="21.4" r="6.5" fill="#F4F7F5"/>
</svg>
